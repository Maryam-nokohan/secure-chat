services:
  redis:
    image: redis:7-alpine
    container_name: secure-chat-redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: secure-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_chat_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: secure-chat-nats
    restart: always
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/jsz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: secure-chat-seaweedfs
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3config.json
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: secure-chat-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: seaweedfsadmin
      AWS_SECRET_ACCESS_KEY: seaweedfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://secure-chat-test || true
      "
  mailpit:
    image: axllent/mailpit
    container_name: secure-chat-mailpit
    ports:
      - "127.0.0.1:8025:8025"   # inbox UI
      - "127.0.0.1:1025:1025"   # SMTP
  app:
    build: .
    container_name: secure-chat-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - DB_HOST=postgres
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

volumes:
  seaweedfs_data:
  postgres_data:
  nats_data:
  avatar_data: