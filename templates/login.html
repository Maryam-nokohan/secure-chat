<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

{{if .error}}
<p style="color:red;">
    {{.error}}
</p>
{{end}}

<form action="/login" method="POST">

    <input
        type="hidden"
        name="_csrf"
        value="{{.csrfToken}}"
    >

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<a href="/register">
    Register?
</a>

</body>
</html>
