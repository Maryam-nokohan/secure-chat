<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

{{if .error}}
<p style="color:red;">
    {{.error}}
</p>
{{end}}

<form action="/login" method="POST">

    <input
        type="hidden"
        name="_csrf"
        value="{{.csrfToken}}"
    >

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<a href="/register">
    Register?
</a>
<script src="/static/crypto-utils.js"></script>
<script>
document.querySelector("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const username = document.querySelector('input[name="username"]').value.trim();
    const password = document.querySelector('input[name="password"]').value;

    const stored = loadWrappedKeypair(username);
    if (stored) {
        try {
            const { wrappingKey } = await deriveWrappingKey(username, password, stored.salt);
            const rawPriv = await unwrapPrivateKeyRaw(stored.wrappedPrivate, stored.iv, wrappingKey);
            sessionStorage.setItem("e2ee_privkey_pkcs8", b64encode(rawPriv));
        } catch (err) {
            console.warn("Could not unlock local encryption key on login:", err);
            sessionStorage.removeItem("e2ee_privkey_pkcs8");
        }
    }

    e.target.submit();
});
</script>
</body>
</html>
