<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Secure Chat</title>
  </head>

  <body>
    <main>
      <section>
        <div>
          <h1>Secure Chat</h1>
          <p>
            Secure messaging with end-to-end encryption.
          </p>
        </div>
      </section>

      <section>
        <div>
          <h2>Welcome back</h2>
          <p>Sign in to continue to Secure Chat.</p>

          {{if .error}}
          <div style="color: red;">
            <span>⚠ {{.error}}</span>
          </div>
          {{end}}

          <form action="/login" method="POST">
            <input type="hidden" name="_csrf" value="{{.csrfToken}}" />

            <div>
              <label for="username">Username</label>
              <div>
                <input
                  id="username"
                  type="text"
                  name="username"
                  required
                  autocomplete="username"
                  placeholder="Enter your username"
                />
              </div>
            </div>

            <div>
              <label for="password">Password</label>
              <div>
                <input
                  id="password"
                  type="password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="Enter your password"
                />
              </div>
            </div>

            <button type="submit">Sign In</button>
          </form>

          <hr />

          <a href="/auth/google">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/>
              <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.1 36.5 26.7 37 24 37c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.6 40.5 16.2 45 24 45z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.4 5.6-6.3 7.1l6.2 5.2C38.9 37.5 44 32 44 24c0-1.2-.1-2.4-.4-3.5z"/>
            </svg>
            Sign in with Google
          </a>

          <div>
            Don't have an account?
            <a href="/register">Create one</a>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/js/crypto-utils.js"></script>
    <script src="/static/js/login.js" defer></script>
  </body>
</html>
