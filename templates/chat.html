<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; overflow: hidden; background-color: #f8f9fa; }
        .chat-container { height: calc(100vh - 56px); }
        .sidebar-left  { width: 200px; min-width: 200px; background: #fff; border-right: 1px solid #dee2e6; overflow-y: auto; }
        .sidebar-right { width: 220px; min-width: 220px; background: #fff; border-left: 1px solid #dee2e6; overflow-y: auto; }
        .chat-area     { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-messages { flex: 1; overflow-y: auto; background: #fff;
            background-image: radial-gradient(#e9ecef 1px, transparent 1px);
            background-size: 16px 16px; }
        .room-item.active { background-color: #e7f1ff; color: #0d6efd; font-weight: 600; }
        .message-bubble { max-width: 75%; border-radius: 15px; padding: 10px 14px; margin-bottom: 8px; }
        .message-system { font-size: 0.8rem; color: #6c757d; text-align: center; margin: 6px 0; }
        .online-dot  { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .online-dot.online  { background: #198754; }
        .online-dot.offline { background: #adb5bd; }
        .member-item { padding: 6px 12px; display: flex; align-items: center; gap: 8px; font-size: 0.875rem; }
        #message-input:disabled { background: #f8f9fa; cursor: not-allowed; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3" style="height:56px;">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-shield-lock-fill text-primary me-2"></i>Secure Chat
    </a>
    <div class="d-flex align-items-center gap-2">
        <span class="text-white small">
            <i class="bi bi-person-circle me-1"></i>
            <strong id="current-user">{{.username}}</strong>
        </span>
        <button class="btn btn-sm btn-outline-light" onclick="showProfile()">
            <i class="bi bi-person-badge"></i>
        </button>
        <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
    </div>
</nav>

<div class="d-flex chat-container">

    <!-- Left sidebar: rooms -->
    <div class="sidebar-left p-2 d-flex flex-column">
        <div class="text-uppercase text-muted fw-bold small mb-2 px-1">Rooms</div>
        <div id="rooms-list" class="list-group list-group-flush mb-2 flex-grow-1"></div>
        <button class="btn btn-sm btn-primary w-100 mb-2"
            data-bs-toggle="modal" data-bs-target="#createRoomModal">
            <i class="bi bi-plus-circle me-1"></i> New Room
        </button>
        <div class="input-group input-group-sm">
            <input type="text" id="invite-input" class="form-control" placeholder="Invite code…">
            <button class="btn btn-outline-secondary" onclick="joinByCode()">
                <i class="bi bi-arrow-right"></i>
            </button>
        </div>
        <div class="mt-2 text-center small" id="conn-status">
            <i class="bi bi-circle-fill text-danger"></i> Offline
        </div>
    </div>

    <!-- Main chat -->
    <div class="chat-area">
        <!-- Room header -->
        <div class="bg-white px-3 py-2 border-bottom d-flex align-items-center justify-content-between">
            <div>
                <span class="fw-bold" id="active-room-title">Select a room</span>
                <span class="text-muted small ms-2" id="room-member-count"></span>
            </div>
            <div class="d-flex gap-2">
                <button id="invite-btn" class="btn btn-sm btn-outline-secondary d-none"
                    onclick="showRoomProfile()">
                    <i class="bi bi-link-45deg me-1"></i> Invite
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages p-3 d-flex flex-column" id="chat-box">
            <div class="message-system">Select or create a room to start chatting.</div>
        </div>

        <!-- Input -->
        <div class="p-2 bg-light border-top">
            <form onsubmit="sendMessage(event)" class="d-flex gap-2">
                <input type="text" id="message-input" class="form-control"
                    placeholder="Type a message…" autocomplete="off"
                    disabled title="Join a room first">
                <button class="btn btn-primary px-3" type="submit">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Right sidebar: members -->
    <div class="sidebar-right p-2">
        <div class="text-uppercase text-muted fw-bold small mb-2 px-1">Members</div>
        <div id="members-list"></div>
    </div>
</div>

<!-- Create Room Modal -->
<div class="modal fade" id="createRoomModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title">Create Room</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="new-room-name" class="form-control form-control-sm"
                    placeholder="Room name" maxlength="100">
                <div id="create-room-error" class="text-danger mt-1 small d-none"></div>
            </div>
            <div class="modal-footer py-2">
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-sm btn-primary" onclick="createRoom()">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- Room Profile Modal -->
<div class="modal fade" id="roomProfileModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="rp-room-name">Room Profile</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small text-muted">Invite Link</label>
                <div class="input-group input-group-sm mb-3">
                    <input type="text" id="rp-invite-url" class="form-control form-control-sm" readonly>
                    <button class="btn btn-outline-secondary" onclick="copyRoomInvite()">
                        <i class="bi bi-clipboard"></i>
                    </button>
                </div>
                <div id="rp-copy-ok" class="text-success small d-none mb-2">✓ Copied!</div>
                <label class="form-label small text-muted">Members</label>
                <div id="rp-members-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- User Profile Modal -->
<div class="modal fade" id="userProfileModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title">My Profile</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center
                    justify-content-center mb-2" style="width:56px;height:56px;font-size:1.4rem;">
                    <span id="up-initial"></span>
                </div>
                <div class="fw-bold" id="up-username"></div>
                <div class="text-muted small" id="up-id"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CSRF_TOKEN  = "{{.csrfToken}}";
const CURRENT_USER = "{{.username}}";
const CURRENT_UID  = "{{.userID}}";

let ws;
let currentRoom     = null;
let currentRoomName = "";
let roomJoinReady   = false; 
let onlineUsers     = {};   

const chatBox      = document.getElementById("chat-box");
const messageInput = document.getElementById("message-input");

function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// ── WebSocket ─────────────────────────────────────────────────
function connectWebSocket() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(`${proto}${location.host}/ws`);

    ws.onopen = () => {
        setConnStatus(true);
        // Re-join after reconnect
        if (currentRoom) sendJoin(currentRoom);
    };

    ws.onmessage = ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }

        switch (msg.type) {
        case "joined":
            if (msg.room_id === currentRoom) {
                roomJoinReady = true;
                messageInput.disabled = false;
                messageInput.placeholder = "Type a message…";
            }
            break;

        case "message":
            if (msg.room_id === currentRoom) appendLiveMessage(msg);
            break;

        case "presence":
            if (msg.online) {
                onlineUsers[msg.user_id] = msg.username;
            } else {
                delete onlineUsers[msg.user_id];
            }
            refreshMembersPanel();
            break;
        }
    };

    ws.onclose = () => {
        setConnStatus(false);
        roomJoinReady = false;
        messageInput.disabled = true;
        setTimeout(connectWebSocket, 3000);
    };
}

function sendJoin(roomID) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        roomJoinReady = false;
        messageInput.disabled = true;
        messageInput.placeholder = "Joining room…";
        ws.send(JSON.stringify({ type: "join", room_id: roomID }));
    }
}

function sendMessage(e) {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !roomJoinReady || !currentRoom) return;
    ws.send(JSON.stringify({ type: "message", room_id: currentRoom, content: text }));
    messageInput.value = "";
}

function setConnStatus(online) {
    document.getElementById("conn-status").innerHTML = online
        ? '<i class="bi bi-circle-fill text-success"></i> Online'
        : '<i class="bi bi-circle-fill text-danger"></i> Offline';
}

// ── Room switching ────────────────────────────────────────────
async function switchRoom(roomID, roomName) {
    if (currentRoom === roomID) return;

    currentRoom     = roomID;
    currentRoomName = roomName;
    roomJoinReady   = false;
    messageInput.disabled = true;

    document.getElementById("active-room-title").textContent = `# ${roomName}`;
    document.getElementById("invite-btn").classList.remove("d-none");
    document.querySelectorAll(".room-item").forEach(el => el.classList.remove("active"));
    const btn = document.querySelector(`.room-item[data-id="${roomID}"]`);
    if (btn) btn.classList.add("active");

    chatBox.innerHTML = `<div class="message-system">Joining #${esc(roomName)}…</div>`;

    // Join the WS room (ack enables the input)
    sendJoin(roomID);

    // Load history and members in parallel
    await Promise.all([loadHistory(roomID), loadRoomProfile(roomID)]);
}

// ── API helpers ───────────────────────────────────────────────
async function loadHistory(roomID) {
    try {
        const res = await fetch(`/rooms/${roomID}/messages`);
        if (!res.ok) return;
        const msgs = await res.json();
        chatBox.innerHTML = "";
        if (!msgs.length) {
            chatBox.innerHTML = `<div class="message-system">No messages yet. Say hello!</div>`;
            return;
        }
        // History comes newest-first; reverse for display
        [...msgs].reverse().forEach(m => appendHistoryMessage(m));
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (e) { console.error(e); }
}

let currentRoomProfile = null;

async function loadRoomProfile(roomID) {
    try {
        const res = await fetch(`/rooms/${roomID}/profile`);
        if (!res.ok) return;
        currentRoomProfile = await res.json();
        currentRoomProfile.members.forEach(m => {
            if (m.online) onlineUsers[m.id] = m.username;
        });
        refreshMembersPanel();
    } catch (e) { console.error(e); }
}

function refreshMembersPanel() {
    const list = document.getElementById("members-list");
    if (!currentRoomProfile) { list.innerHTML = ""; return; }

    const members = currentRoomProfile.members || [];
    document.getElementById("room-member-count").textContent =
        `${members.length} member${members.length !== 1 ? "s" : ""}`;

    list.innerHTML = members.map(m => {
        const isOnline = !!onlineUsers[m.id];
        return `<div class="member-item">
            <span class="online-dot ${isOnline ? "online" : "offline"}"></span>
            <span>${esc(m.username)}</span>
            ${m.id === CURRENT_UID ? '<span class="badge bg-secondary ms-auto" style="font-size:.65rem">you</span>' : ""}
        </div>`;
    }).join("");
}

async function createRoom() {
    const name  = document.getElementById("new-room-name").value.trim();
    const errEl = document.getElementById("create-room-error");
    errEl.classList.add("d-none");
    if (!name) { errEl.textContent = "Name required."; errEl.classList.remove("d-none"); return; }

    try {
        const res  = await fetch("/rooms", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRF-Token": CSRF_TOKEN },
            body: JSON.stringify({ name }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error; errEl.classList.remove("d-none"); return; }

        bootstrap.Modal.getInstance(document.getElementById("createRoomModal")).hide();
        document.getElementById("new-room-name").value = "";
        addRoomToSidebar(data.id, data.name);
        await switchRoom(data.id, data.name);
    } catch (e) {
        errEl.textContent = "Network error.";
        errEl.classList.remove("d-none");
    }
}

async function joinByCode() {
    const raw   = document.getElementById("invite-input").value.trim();
    if (!raw) return;
    const match = raw.match(/\/join\/([a-f0-9]+)/);
    const code  = match ? match[1] : raw;
    try {
        const res  = await fetch(`/join/${code}`, { headers: { "X-CSRF-Token": CSRF_TOKEN } });
        const data = await res.json();
        if (!res.ok) { alert(data.error || "Invalid code."); return; }
        document.getElementById("invite-input").value = "";
        addRoomToSidebar(data.id, data.name);
        await switchRoom(data.id, data.name);
    } catch { alert("Network error."); }
}

function addRoomToSidebar(id, name) {
    const list = document.getElementById("rooms-list");
    if (document.querySelector(`.room-item[data-id="${id}"]`)) return;
    const btn = document.createElement("button");
    btn.className = "list-group-item list-group-item-action room-item py-1 px-2 text-truncate";
    btn.dataset.id = id;
    btn.innerHTML  = `<i class="bi bi-hash me-1"></i>${esc(name)}`;
    btn.onclick    = () => switchRoom(id, name);
    list.appendChild(btn);
}

async function loadRooms() {
    try {
        const res   = await fetch("/rooms");
        if (!res.ok) return;
        const rooms = await res.json();
        rooms.forEach(r => addRoomToSidebar(r.id, r.name));
        if (rooms.length) await switchRoom(rooms[0].id, rooms[0].name);
    } catch (e) { console.error(e); }
}

// ── Profile modals ────────────────────────────────────────────
async function showProfile() {
    try {
        const res  = await fetch("/profile");
        const data = await res.json();
        document.getElementById("up-initial").textContent  = data.username[0].toUpperCase();
        document.getElementById("up-username").textContent = data.username;
        document.getElementById("up-id").textContent       = data.id;
        new bootstrap.Modal(document.getElementById("userProfileModal")).show();
    } catch { alert("Failed to load profile."); }
}

function showRoomProfile() {
    if (!currentRoomProfile) return;
    document.getElementById("rp-room-name").textContent  = currentRoomProfile.name;
    document.getElementById("rp-invite-url").value       = currentRoomProfile.invite_url;
    document.getElementById("rp-copy-ok").classList.add("d-none");

    const el = document.getElementById("rp-members-list");
    el.innerHTML = (currentRoomProfile.members || []).map(m => {
        const online = !!onlineUsers[m.id];
        return `<div class="member-item border-bottom">
            <span class="online-dot ${online ? "online" : "offline"}"></span>
            <span>${esc(m.username)}</span>
            ${m.id === CURRENT_UID ? '<span class="badge bg-secondary ms-auto" style="font-size:.65rem">you</span>' : ""}
        </div>`;
    }).join("");

    new bootstrap.Modal(document.getElementById("roomProfileModal")).show();
}

function copyRoomInvite() {
    const url = document.getElementById("rp-invite-url").value;
    navigator.clipboard.writeText(url).then(() => {
        const el = document.getElementById("rp-copy-ok");
        el.classList.remove("d-none");
        setTimeout(() => el.classList.add("d-none"), 2000);
    });
}

// ── Message rendering ─────────────────────────────────────────
function appendLiveMessage(msg) {
    const isSelf = msg.username === CURRENT_USER;
    chatBox.appendChild(bubble(isSelf ? "You" : msg.username, msg.content, isSelf, fmtTime(msg.time)));
    chatBox.scrollTop = chatBox.scrollHeight;
}

function appendHistoryMessage(msg) {
    const isSelf = msg.sender_id === CURRENT_UID;
    chatBox.appendChild(bubble(isSelf ? "You" : msg.username, msg.content, isSelf, fmtTime(msg.time)));
}
function bubble(label, content, isSelf, time) {
    const row = document.createElement("div");
    row.className = `d-flex w-100 ${isSelf ? "justify-content-end" : "justify-content-start"}`;
    const timeHtml = time ? `<div class="small opacity-50 mt-1">${esc(time)}</div>` : "";
    if (isSelf) {
        row.innerHTML = `<div class="message-bubble bg-primary text-white shadow-sm">
            <div class="small fw-light opacity-75">You</div>
            <div>${esc(content)}</div>${timeHtml}</div>`;
    } else {
        row.innerHTML = `<div class="message-bubble bg-light border text-dark shadow-sm">
            <div class="small fw-bold text-primary">${esc(label)}</div>
            <div>${esc(content)}</div>${timeHtml}</div>`;
    }
    return row;
}

function esc(str) {
    if (!str) return "";
    return str.replace(/[&<>'"]/g,
        t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
}

window.onload = () => { connectWebSocket(); loadRooms(); };
</script>
</body>
</html>
