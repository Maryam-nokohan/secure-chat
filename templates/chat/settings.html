<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Secure Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-3">
      <a class="navbar-brand"><i class="bi bi-gear-fill me-2"></i>Settings</a>
      <a href="/chat" class="btn btn-sm btn-outline-light">Back to Chat</a>
    </nav>

    <div class="container py-4" style="max-width: 480px">
      <div class="card mb-3">
        <div class="card-body text-center">
          <img
            id="avatar-preview"
            src=""
            alt=""
            class="rounded-circle mb-2 d-none"
            style="width: 96px; height: 96px; object-fit: cover"
          />
          <div
            id="avatar-fallback"
            class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center mb-2"
            style="width: 96px; height: 96px; font-size: 2rem"
          >
            <span id="avatar-initial"></span>
          </div>
          <div>
            <input
              type="file"
              id="avatar-input"
              accept="image/png,image/jpeg,image/webp"
              class="d-none"
            />
            <button
              class="btn btn-sm btn-outline-secondary"
              onclick="document.getElementById('avatar-input').click()"
            >
              Change photo
            </button>
          </div>
          <div id="avatar-error" class="text-danger small mt-2 d-none"></div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <label class="form-label small text-muted">Contact ID</label>
          <div class="input-group input-group-sm mb-1">
            <input type="text" id="public-id" class="form-control" readonly />
            <button class="btn btn-outline-secondary" onclick="copyPublicId()">
              <i class="bi bi-clipboard"></i>
            </button>
          </div>
          <div id="copy-ok" class="text-success small d-none">Copied!</div>
          <div class="text-muted small">
            Share this so others can add you as a contact.
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label small">Username</label>
            <input
              type="text"
              id="username-input"
              class="form-control"
              maxlength="50"
            />
          </div>
          <div class="mb-3">
            <label class="form-label small">Bio</label>
            <textarea
              id="bio-input"
              class="form-control"
              rows="3"
              maxlength="500"
            ></textarea>
          </div>
          <div id="profile-error" class="text-danger small d-none mb-2"></div>
          <div id="profile-ok" class="text-success small d-none mb-2">
            Saved.
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveProfile()">
            Save changes
          </button>
        </div>
      </div>
    </div>

    <script>
      window.CSRF_TOKEN = "{{.csrfToken}}";
    </script>
    <script src="/static/js/settings.js" defer></script>
  </body>
</html>
