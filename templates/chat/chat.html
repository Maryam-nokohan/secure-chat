<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        height: 100%;
        overflow: hidden;
        background-color: #f8f9fa;
      }
      .chat-container {
        height: calc(100vh - 56px);
      }
      .sidebar-left {
        width: 200px;
        min-width: 200px;
        background: #fff;
        border-right: 1px solid #dee2e6;
        overflow-y: auto;
      }
      .sidebar-right {
        width: 220px;
        min-width: 220px;
        background: #fff;
        border-left: 1px solid #dee2e6;
        overflow-y: auto;
      }
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        background: #fff;
        background-image: radial-gradient(#e9ecef 1px, transparent 1px);
        background-size: 16px 16px;
      }
      .room-item.active {
        background-color: #e7f1ff;
        color: #0d6efd;
        font-weight: 600;
      }
      .message-bubble {
        max-width: 75%;
        border-radius: 15px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .message-system {
        font-size: 0.8rem;
        color: #6c757d;
        text-align: center;
        margin: 6px 0;
      }
      .online-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .online-dot.online {
        background: #198754;
      }
      .online-dot.offline {
        background: #adb5bd;
      }
      .member-item {
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
      }
      #message-input:disabled {
        background: #f8f9fa;
        cursor: not-allowed;
      }
      .unread-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0d6efd;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3" style="height: 56px">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-shield-lock-fill text-primary me-2"></i>Secure Chat
      </a>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white small">
          <i class="bi bi-person-circle me-1"></i>
          <strong id="current-user">{{.username}}</strong>
        </span>
        <button class="btn btn-sm btn-outline-light" onclick="showProfile()">
          <i class="bi bi-person-badge"></i>
        </button>
        <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
      </div>
    </nav>

    <div class="d-flex chat-container">
      <!-- Left sidebar: rooms -->
      <div class="sidebar-left p-2 d-flex flex-column">
        <div class="text-uppercase text-muted fw-bold small mb-2 px-1">
          Rooms
        </div>
        <div
          id="rooms-list"
          class="list-group list-group-flush mb-2 flex-grow-1"
        ></div>
        <button
          class="btn btn-sm btn-primary w-100 mb-2"
          data-bs-toggle="modal"
          data-bs-target="#createRoomModal"
        >
          <i class="bi bi-plus-circle me-1"></i> New Room
        </button>
        <div class="input-group input-group-sm">
          <input
            type="text"
            id="invite-input"
            class="form-control"
            placeholder="Invite code…"
          />
          <button class="btn btn-outline-secondary" onclick="joinByCode()">
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
        <div class="mt-2 text-center small" id="conn-status">
          <i class="bi bi-circle-fill text-danger"></i> Offline
        </div>
      </div>

      <!-- Main chat -->
      <div class="chat-area">
        <!-- Room header -->
        <div
          class="bg-white px-3 py-2 border-bottom d-flex align-items-center justify-content-between"
        >
          <div>
            <span class="fw-bold" id="active-room-title">Select a room</span>
            <span class="text-muted small ms-2" id="room-member-count"></span>
          </div>
          <div class="d-flex gap-2">
            <button
              id="invite-btn"
              class="btn btn-sm btn-outline-secondary d-none"
              onclick="showRoomProfile()"
            >
              <i class="bi bi-link-45deg me-1"></i> Invite
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages p-3 d-flex flex-column" id="chat-box">
          <div class="message-system">
            Select or create a room to start chatting.
          </div>
        </div>

        <!-- Input -->
        <div class="p-2 bg-light border-top">
          <form onsubmit="sendMessage(event)" class="d-flex gap-2">
            <input
              type="text"
              id="message-input"
              class="form-control"
              placeholder="Type a message…"
              autocomplete="off"
              disabled
              title="Join a room first"
            />
            <button class="btn btn-primary px-3" type="submit">
              <i class="bi bi-send-fill"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Right sidebar: members -->
      <div class="sidebar-right p-2">
        <div class="text-uppercase text-muted fw-bold small mb-2 px-1">
          Members
        </div>
        <div id="members-list"></div>
      </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal fade" id="createRoomModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h6 class="modal-title">Create Room</h6>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="text"
              id="new-room-name"
              class="form-control form-control-sm"
              placeholder="Room name"
              maxlength="100"
            />
            <div
              id="create-room-error"
              class="text-danger mt-1 small d-none"
            ></div>
          </div>
          <div class="modal-footer py-2">
            <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-sm btn-primary" onclick="createRoom()">
              Create
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Room Profile Modal -->
    <div class="modal fade" id="roomProfileModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h6 class="modal-title" id="rp-room-name">Room Profile</h6>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <label class="form-label small text-muted">Invite Link</label>
            <div class="input-group input-group-sm mb-3">
              <input
                type="text"
                id="rp-invite-url"
                class="form-control form-control-sm"
                readonly
              />
              <button
                class="btn btn-outline-secondary"
                onclick="copyRoomInvite()"
              >
                <i class="bi bi-clipboard"></i>
              </button>
            </div>
            <div id="rp-copy-ok" class="text-success small d-none mb-2">
              ✓ Copied!
            </div>
            <label class="form-label small text-muted">Members</label>
            <div id="rp-members-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- User Profile Modal -->
    <div class="modal fade" id="userProfileModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h6 class="modal-title">My Profile</h6>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center">
            <div
              class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center mb-2"
              style="width: 56px; height: 56px; font-size: 1.4rem"
            >
              <span id="up-initial"></span>
            </div>
            <div class="fw-bold" id="up-username"></div>
            <div class="text-muted small" id="up-id"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/crypto-utils.js"></script>
    <script>
      window.CSRF_TOKEN = "{{.csrfToken}}";
      window.CURRENT_USER = "{{.username}}";
      window.CURRENT_UID = "{{.userID}}";
    </script>
    <script src="/static/js/chat.js" defer></script>
  </body>
</html>
